name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const version = require('./package.json').version; if (process.env.RELEASE_TAG !== 'v' + version) { throw new Error('Release tag must be v' + version); }"
      - name: Validate package
        run: pnpm run validate
      - name: Check published version
        id: published
        run: node -e "const { name, version } = require('./package.json'); require('child_process').execFile('npm', ['view', name + '@' + version, 'version'], error => require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'exists=' + !error + '\n'));"
      - name: Publish package
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public --provenance
